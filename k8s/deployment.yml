apiVersion: apps/v1
kind: Deployment
metadata:
  name: grade-calc-deployment
  labels:
    app: grade-calc
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grade-calc
  template:
    metadata:
      labels:
        app: grade-calc
    spec:
      containers:
      - name: grade-calc-container
        image: IMAGE_PLACEHOLDER  # Replaced dynamically by GitHub Actions workflow
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: grade-calc-service
spec:
  type: LoadBalancer
  selector:
    app: grade-calc
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000

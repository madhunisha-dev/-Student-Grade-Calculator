name: CI/CD Pipeline - Grade Calculator

on:
  push:
    branches:
      - main

jobs:
  ci-cd-pipeline:
    runs-on: ubuntu-latest
    steps:
    # Stage 1 & 2: Source Code & Version Control
    - name: Checkout Source Code
      uses: actions/checkout@v4

    # Stage 3: Continuous Integration
    - name: Setup Python Runtime
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Automated Test Suite
      run: |
        pytest test_app.py

    # Stage 4: Build
    - name: Docker Hub Authentication
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Tagged Container Image
      run: |
        TAG_VERSION="v${{ github.run_number }}"
        IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/grade-calculator:$TAG_VERSION"
        
        docker build -t $IMAGE_NAME .
        docker push $IMAGE_NAME
        
        # Save tag version for the deployment step
        echo "DEPLOY_IMAGE=$IMAGE_NAME" >> $GITHUB_ENV

    # Stage 5: Deployment
    - name: Configure Kubernetes Authentication
      run: |
        mkdir -p ~/.kube
        echo "${{ secrets.KUBECONFIG_DATA }}" | base64 --decode > ~/.kube/config

    - name: Execute Kubernetes Rollout
      run: |
        # Inject the freshly built image tag into the manifest file
        sed -i "s|IMAGE_PLACEHOLDER|${{ env.DEPLOY_IMAGE }}|g" k8s/deployment.yml
        kubectl apply -f k8s/deployment.yml
